# Render blueprint — static site, front-end only.
#
# This deploy has NO backend. Orders are saved in the browser and no kitchen
# receives them; the UI says so on the checkout and order screens. The Express +
# SQLite server in /server is written and tested but deliberately not deployed.
#
# To connect it later: deploy the server separately, then rebuild this site with
# VITE_API_BASE set to its URL. Every order then goes over the wire and the
# local-only notices disappear on their own.

services:
  - type: web
    name: the-home-screen
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    # Single-page app: every path must serve index.html or a deep link 404s.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Hashed filenames, so the assets are safe to cache hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=604800
      # index.html must never be cached, or a deploy takes hours to reach users.
      - path: /index.html
        name: Cache-Control
        value: no-cache
